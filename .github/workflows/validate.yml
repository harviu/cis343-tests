name: Validate test harness
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python run_tests.py --list
      - run: python -m compileall -q run_tests.py lab* harness_tests
      - run: python -m unittest discover -s harness_tests -v
